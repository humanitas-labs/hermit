<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hermit strip treemap</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <style>
      :root {
        --bg: #0c0d0d;
        --panel: #131314;
        --raise: #1d1e20;
        --line: #191919;
        --white: #ffffff;
        --muted: #959eac;
        --dim: #5c6066;
        --nav: #b9bec7;
        --del: #cb7676;
        --sf: -apple-system, "SF Pro", "SF Pro Text", "Helvetica Neue", Inter, sans-serif;
        --inter: Inter, -apple-system, "Helvetica Neue", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--white);
        font: 12.5px/1.35 var(--inter);
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
        padding: 16px 24px 24px;
        gap: 12px;
        -webkit-font-smoothing: antialiased;
      }
      .sw {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: 0;
      }
      .sw.hatch {
        background-image: repeating-linear-gradient(135deg, var(--del) 0 1.5px, transparent 1.5px 4px);
        background-color: rgba(203, 118, 118, 0.25);
      }
      .right {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .seg {
        display: flex;
        gap: 2px;
        padding: 3px;
        background: var(--panel);
        border-radius: 999px;
      }
      .seg button {
        background: transparent;
        border: 0;
        color: var(--muted);
        font: 400 12.5px var(--inter);
        padding: 5px 16px;
        border-radius: 99px;
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--raise);
        color: var(--white);
        font-weight: 500;
      }
      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-family: var(--sf);
      }
      .title b {
        font-weight: 590;
        font-size: 30px;
        color: var(--white);
      }
      .title span {
        font-weight: 400;
        font-size: 20px;
        color: var(--muted);
      }
      .title .arrow {
        color: var(--dim);
        font-size: 20px;
        margin: 0 2px;
      }
      .title .sha {
        font-family: var(--inter);
        font-size: 12px;
        color: var(--dim);
        margin-left: 6px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .nav b {
        color: var(--white);
        font-weight: 500;
        font-family: var(--inter);
        font-variant-numeric: tabular-nums;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 260px;
        gap: 24px;
        min-height: 0;
      }
      #stage {
        position: relative;
        min-height: 0;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      aside {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: auto;
        font-variant-numeric: tabular-nums;
      }
      .sec {
        padding: 8px 0 14px;
      }
      .sec + .sec {
        border-top: 1px solid var(--line);
      }
      .lab {
        font-size: 12px;
        color: var(--muted);
        padding-bottom: 6px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 4px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .row b {
        font-weight: 500;
        font-size: 13px;
        color: var(--white);
      }
      .row b.del {
        color: var(--del);
      }
      .row .cnt {
        color: var(--dim);
        font-size: 12px;
        margin-left: 6px;
        font-weight: 400;
      }
      .strip {
        display: flex;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        margin: 6px 0 2px;
      }
      .strip i {
        display: block;
        height: 100%;
      }
      .strip .d {
        background-image: repeating-linear-gradient(135deg, var(--del) 0 1.5px, transparent 1.5px 4px);
        background-color: rgba(203, 118, 118, 0.3);
      }
      .strip .k {
        background: var(--raise);
      }
      #sel .name {
        font-size: 13px;
        font-weight: 500;
        color: var(--white);
        word-break: break-all;
        padding-bottom: 2px;
      }
      #sel .state {
        font-size: 11px;
        color: var(--muted);
        padding-bottom: 6px;
      }
      #sel .state.del {
        color: var(--del);
      }
      #sel .hint {
        color: var(--dim);
        font-size: 12px;
      }
      text {
        pointer-events: none;
      }
      .g-title {
        fill: var(--white);
        font: 500 12.5px var(--sf);
      }
      .g-total {
        fill: var(--muted);
        font: 400 11px var(--inter);
      }
      .t-name {
        fill: var(--white);
        font: 500 11.4px var(--inter);
      }
      .t-val {
        fill: var(--muted);
        font: 400 10.5px var(--inter);
      }
      .cut .t-name {
        fill: #ffffff;
      }
      .cut .t-val {
        fill: #cdb9b9;
      }
      .plate {
        fill: #0c0d0d;
        opacity: 0.78;
      }
      .tile rect {
        stroke: var(--bg);
        stroke-width: 2;
      }
      .tile:hover rect {
        filter: brightness(1.35);
      }
      .grp > rect {
        stroke: var(--bg);
        stroke-width: 3;
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <div class="title">
        <b>opencode</b><span>1.18.32</span><span class="arrow">›</span><b>hermit</b><span class="sha">adee738d1e</span>
      </div>
      <div class="right">
        <div class="nav" id="nav"></div>
        <div class="seg" id="metrics">
          <button data-m="1" aria-pressed="true">Lines</button>
          <button data-m="2" aria-pressed="false">Files</button>
          <button data-m="3" aria-pressed="false">Bytes</button>
        </div>
      </div>
    </div>
    <main>
      <div id="stage"><svg id="svg"></svg></div>
      <aside>
        <div class="sec" id="totals"></div>
        <div class="sec" id="groups"></div>
        <div class="sec" id="sel">
          <div class="lab">Selection</div>
          <div class="hint">Hover a tile</div>
        </div>
      </aside>
    </main>
    <script>
      // path, source lines, tracked files, tracked bytes, group — all at upstream commit adee738d1e
      // Group "added" is reserved for code Hermit introduces (plans 10 and 11); add rows measured from the Hermit tree, not the fork point.
      const DATA = [
        ["packages/app", 155187, 643, 12383983, "ui"],
        ["packages/opencode", 82371, 836, 18140959, "agent"],
        ["packages/console", 42899, 589, 50440987, "hosted"],
        ["packages/ui", 33709, 1695, 6862829, "ui"],
        ["packages/core", 33226, 491, 2613658, "agent"],
        ["packages/tui", 27066, 241, 1225768, "tui"],
        ["packages/session-ui", 20304, 118, 777361, "ui"],
        ["packages/stats", 17887, 115, 1549100, "hosted"],
        ["packages/llm", 10589, 152, 1330195, "agent"],
        ["packages/desktop", 8379, 306, 8790848, "ui"],
        ["packages/web", 6952, 705, 13252665, "marketing"],
        ["packages/codemode", 6887, 41, 1130404, "agent"],
        ["packages/schema", 3396, 74, 123134, "agent"],
        ["packages/effect-drizzle-sqlite", 3339, 26, 127937, "infra"],
        ["script", 2432, 18, 87884, "ops"],
        ["packages/server", 1691, 31, 62470, "agent"],
        ["packages/http-recorder", 1679, 24, 111015, "infra"],
        ["packages/plugin", 1659, 42, 68282, "agent"],
        ["packages/protocol", 1591, 26, 61613, "agent"],
        ["infra", 1304, 8, 41374, "hosted"],
        ["artifacts", 1259, 20, 8140145, "marketing"],
        ["packages/enterprise", 1227, 36, 58491, "hosted"],
        ["packages/httpapi-codegen", 1194, 16, 122155, "ui"],
        ["packages/storybook", 1174, 28, 67208, "ui"],
        [".opencode", 1147, 39, 86653, "ops"],
        ["github", 1081, 10, 58189, "ops"],
        ["packages/cli", 855, 25, 39489, "ops"],
        ["packages/client", 832, 21, 212953, "ui"],
        ["packages/sdk", 805, 48, 1721576, "infra"],
        ["packages/function", 411, 6, 15332, "hosted"],
        ["sst-env.d.ts", 311, 1, 7063, "hosted"],
        ["nix", 231, 6, 15560, "ops"],
        ["packages/effect-sqlite-node", 177, 4, 7662, "infra"],
        ["packages/slack", 154, 7, 6358, "hosted"],
        ["sdks", 146, 16, 73486, "ops"],
        ["packages/script", 86, 4, 3313, "infra"],
        ["packages/containers", 77, 8, 6040, "ops"],
        ["packages/sdk-next", 77, 9, 16657, "ops"],
        ["sst.config.ts", 53, 1, 1561, "hosted"],
        [".github", 0, 36, 104850, "ops"],
        ["bun.lock", 0, 1, 879386, "infra"],
        ["packages/docs", 0, 24, 451344, "marketing"],
        ["packages/identity", 0, 6, 1863, "marketing"],
        ["patches", 0, 20, 169648, "infra"],
        ["screenshot-uk.png", 0, 1, 83462, "marketing"],
        ["specs", 0, 14, 242858, "infra"],
      ]

      const GROUPS = {
        added: { label: "Added", keep: true, added: true, fill: "#4d9375" },
        agent: { label: "Agent core", keep: true, fill: "#26272a" },
        tui: { label: "TUI", keep: true, fill: "#2e2f33" },
        infra: { label: "Storage & tooling", keep: true, fill: "#1f2022" },
        ui: { label: "Web & desktop UI", keep: false },
        hosted: { label: "Hosted services", keep: false },
        marketing: { label: "Marketing & docs", keep: false },
        ops: { label: "Release & ops", keep: false },
      }
      const ORDER = ["added", "agent", "tui", "infra", "ui", "hosted", "marketing", "ops"]
      const UNITS = { 1: "lines", 2: "files", 3: "bytes" }
      const AFTER = { 1: 174509, 2: 2114, 3: 32900 * 1024 }
      const fmt = (n) => n.toLocaleString("en-US")
      const fmtB = (n) =>
        n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024) + " KB" : n + " B"
      const val = (n, m) => (m === 3 ? fmtB(n) : fmt(n))
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
      let metric = 1

      function squarify(items, x, y, w, h) {
        const out = []
        let rest = items.filter((d) => d.v > 0)
        let rx = x,
          ry = y,
          rw = w,
          rh = h
        while (rest.length && rw > 0 && rh > 0) {
          const scale = (rw * rh) / rest.reduce((s, d) => s + d.v, 0)
          const side = Math.min(rw, rh)
          const worst = (r) => {
            const s = r.reduce((a, d) => a + d.v * scale, 0)
            const mx = Math.max(...r.map((d) => d.v * scale)),
              mn = Math.min(...r.map((d) => d.v * scale))
            return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn))
          }
          let row = [rest[0]],
            i = 1
          while (i < rest.length && worst(row.concat(rest[i])) <= worst(row)) row.push(rest[i++])
          const rs = row.reduce((a, d) => a + d.v * scale, 0)
          if (rw >= rh) {
            const cw = rs / rh
            let cy = ry
            for (const d of row) {
              const ch = (d.v * scale) / cw
              out.push({ ...d, x: rx, y: cy, w: cw, h: ch })
              cy += ch
            }
            rx += cw
            rw -= cw
          } else {
            const chh = rs / rw
            let cx = rx
            for (const d of row) {
              const cw = (d.v * scale) / chh
              out.push({ ...d, x: cx, y: ry, w: cw, h: chh })
              cx += cw
            }
            ry += chh
            rh -= chh
          }
          rest = rest.slice(i)
        }
        return out
      }

      const items = () =>
        DATA.map((d) => ({
          full: d[0],
          name: d[0].replace(/^packages\//, ""),
          lines: d[1],
          files: d[2],
          bytes: d[3],
          g: d[4],
          v: d[metric],
        }))
      const sw = (g) =>
        GROUPS[g].keep ? `<i class="sw" style="background:${GROUPS[g].fill}"></i>` : `<i class="sw hatch"></i>`

      function tileText(t, cut) {
        const x = t.x + 7
        const stats = [`${fmt(t.lines)} lines`, `${fmt(t.files)} files`, fmtB(t.bytes)]
        const lines = []
        if (t.w > 60 && t.h > 24) lines.push(["t-name", esc(t.name)])
        else return ""
        if (t.w > 110 && t.h > 72) stats.forEach((s) => lines.push(["t-val", s]))
        else if (t.w > 200 && t.h > 40) lines.push(["t-val", stats.join(" · ")])
        else if (t.w > 70 && t.h > 40)
          lines.push(["t-val", `${val(t.v, metric)}${metric === 3 ? "" : " " + UNITS[metric]}`])
        const text = lines
          .map(([c, s], i) => `<text class="${c}" x="${x}" y="${t.y + 16 + (i ? 2 : 0) + i * 14}">${s}</text>`)
          .join("")
        if (!cut) return text
        const w = Math.min(t.w - 6, 12 + Math.max(...lines.map(([, s]) => s.length)) * 6.4)
        const h = 8 + lines.length * 14 + (lines.length > 1 ? 2 : 0)
        return `<rect class="plate" x="${t.x + 3}" y="${t.y + 3}" width="${w}" height="${h}" rx="3"/>` + text
      }

      function render() {
        const svg = document.getElementById("svg")
        const box = svg.getBoundingClientRect()
        const W = Math.max(320, box.width),
          H = Math.max(320, box.height)
        const all = items()
        const total = all.reduce((s, d) => s + d.v, 0)
        const groups = ORDER.map((g) => ({
          g,
          v: all.filter((d) => d.g === g).reduce((s, d) => s + d.v, 0),
          kids: all.filter((d) => d.g === g).sort((a, b) => b.v - a.v),
        }))
          .filter((x) => x.v > 0)
          .sort((a, b) => b.v - a.v)
        const laid = squarify(groups, 0, 0, W, H)
        let html = `<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#cb7676" opacity="0.16"/><rect width="1.6" height="7" fill="#cb7676" opacity="0.8"/></pattern></defs>`
        const HEAD = 24,
          PAD = 3
        for (const G of laid) {
          const meta = GROUPS[G.g]
          const fill = meta.keep ? meta.fill : "url(#hatch)"
          html += `<g class="grp"><rect x="${G.x}" y="${G.y}" width="${G.w}" height="${G.h}" fill="${meta.keep ? "#131314" : "#1a1213"}"/>`
          if (G.w > 90) html += `<text class="g-title" x="${G.x + 8}" y="${G.y + 16}">${esc(meta.label)}</text>`
          if (G.w > 220)
            html += `<text class="g-total" x="${G.x + G.w - 8}" y="${G.y + 16}" text-anchor="end">${val(G.v, metric)} · ${Math.round((G.v / total) * 100)}%</text>`
          const inner = squarify(
            G.kids,
            G.x + PAD,
            G.y + HEAD + PAD,
            Math.max(0, G.w - PAD * 2),
            Math.max(0, G.h - HEAD - PAD * 2),
          )
          for (const t of inner) {
            const idx = all.findIndex((d) => d.full === t.full)
            html += `<g class="tile ${meta.keep ? "" : "cut"}" data-i="${idx}"><rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" fill="${fill}"/>${tileText(t, !meta.keep)}</g>`
          }
          html += "</g>"
        }
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`)
        svg.innerHTML = html

        const unit = UNITS[metric]
        const kept = all.filter((d) => GROUPS[d.g].keep).reduce((s, d) => s + d.v, 0)
        const pct = Math.round((1 - kept / total) * 100)
        const byGroup = {}
        for (const d of all) byGroup[d.g] = (byGroup[d.g] || 0) + d.v
        const nGroup = {}
        for (const d of all) nGroup[d.g] = (nGroup[d.g] || 0) + 1
        const live = ORDER.filter((g) => byGroup[g])

        document.getElementById("nav").innerHTML =
          `<span>Before <b>${val(total, metric)}</b></span><span>After <b>${val(AFTER[metric], metric)}</b></span><span>Removed <b style="color:var(--del)">−${pct}%</b></span>`

        document.getElementById("totals").innerHTML = `<div class="lab">${unit[0].toUpperCase() + unit.slice(1)}</div>
    <div class="row"><span>Removed</span><b class="del">${val(total - kept, metric)}</b></div>
    <div class="strip"><i class="d" style="width:${pct}%"></i><i class="k" style="width:${100 - pct}%"></i></div>
    <div class="row"><span>Kept</span><b>${val(kept, metric)}</b></div>
    <div class="row"><span>Packages</span><b>36<span class="cnt">→ 14</span></b></div>
    <div class="row"><span>Locked dependencies</span><b>3,248<span class="cnt">→ 1,142</span></b></div>`
        document.getElementById("groups").innerHTML =
          `<div class="lab">Groups</div>` +
          live
            .map(
              (g) =>
                `<div class="row"><span>${sw(g)}${GROUPS[g].label}<span class="cnt">${nGroup[g]}</span></span><b class="${GROUPS[g].keep ? "" : "del"}">${val(byGroup[g], metric)}</b></div>`,
            )
            .join("")

        const sel = document.getElementById("sel")
        svg.querySelectorAll(".tile").forEach((el) => {
          const d = all[+el.dataset.i]
          const G = GROUPS[d.g]
          el.addEventListener("mouseenter", () => {
            sel.innerHTML = `<div class="lab">Selection</div><div class="name">${esc(d.full)}</div><div class="state ${G.keep ? "" : "del"}">${G.added ? "Added" : G.keep ? "Kept" : "Deleted"} · ${G.label}</div>
        <div class="row"><span>Source lines</span><b>${fmt(d.lines)}</b></div><div class="row"><span>Tracked files</span><b>${fmt(d.files)}</b></div><div class="row"><span>Tracked bytes</span><b>${fmtB(d.bytes)}</b></div>`
          })
        })
      }
      document.getElementById("metrics").addEventListener("click", (e) => {
        const b = e.target.closest("button")
        if (!b) return
        metric = +b.dataset.m
        ;[...e.currentTarget.children].forEach((x) => x.setAttribute("aria-pressed", x === b))
        render()
      })
      window.addEventListener("resize", render)
      if (location.search.includes("export")) document.getElementById("sel").style.display = "none"
      render()
    </script>
  </body>
</html>
